<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05050c" />
    <meta
      name="description"
      content="CODE KOLKATA is a 24-hour coding build sprint hosted by two communities. Tracks, schedule, prizes and registration in one place."
    />
    <meta property="og:title" content="CODE KOLKATA — 24-hour coding build sprint" />
    <meta
      property="og:description"
      content="CODE KOLKATA brings two communities together for a 24-hour coding build sprint. Dates and venue are announced soon."
    />
    <meta property="og:type" content="website" />

    <!-- Resolve the saved theme before the first paint to avoid a flash. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("ck-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          var root = document.documentElement;
          var ink = theme === "light" ? "#f5f6fa" : "#05050c";
          root.dataset.theme = theme;
          root.style.colorScheme = theme;
          root.style.backgroundColor = ink;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", ink);
        } catch (error) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Press+Start+2P&family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="preload"
      as="image"
      href="/media/hero-poster-mobile.jpg"

    <link

    <title>CODE KOLKATA — 24-hour coding build sprint</title>
  </head>
