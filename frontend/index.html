<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/src/assets/CodeKolkataLogo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05050c" />
    <meta
      name="description"
      content="Code Kolkata is a combination of workshop and buildathon hosted by Bug Busters community. Tracks, schedule, prizes and registration in one place."
    />
    <meta property="og:title" content="Code Kolkata" />
    <meta
      property="og:description"
      content="Code Kolkata brings 100 developers for a coding build sprint. Date is 28th november and venue is Jadavpur University."
    />
    <meta property="og:type" content="website" />

    <!-- Resolve the saved theme before the first paint to avoid a flash. -->
    <script>
      (function () {
        try {
          var cookieMatch = document.cookie.match(/(?:^|; )ck-theme=([^;]*)/);
          var stored =
            localStorage.getItem("ck-theme") ||
            (cookieMatch ? decodeURIComponent(cookieMatch[1]) : null);
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          var root = document.documentElement;
          var ink = theme === "light" ? "#f5f6fa" : "#05050c";
          root.dataset.theme = theme;
          root.style.colorScheme = theme;
          root.style.backgroundColor = ink;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", ink);
        } catch (error) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Press+Start+2P&family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />

    <title>Code Kolkata</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
